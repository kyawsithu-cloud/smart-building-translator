# Project defaults. Override any key in %LOCALAPPDATA%\SmartBuildingTranslator\settings.toml
# (same keys, sections optional). See README.md.

[privacy]
mode = "offline"            # only offline exists; online mode would need explicit per-job consent
use_memory = true           # keep a local translation memory (contains document text; `sbt history clear`)

[engine]
model = "hy-mt2-7b"         # see `python -m sbt doctor`
repair_model = "qwen3-8b"   # second engine for paragraphs still flagged after retries ("" = off)
gpu = "auto"                # auto | cpu

[translation]
glossary = "smart-building"
doc_terms = "vote"          # recurring-term consistency: off | vote | hint | enforce (see PHASE2_RESULTS)
protect = "verify"          # verify | mask

[render]
min_font_scale = 0.8        # never shrink text below 80 % of the original; flag instead
