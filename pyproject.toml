[project]
name = "smart-building-translator"
version = "0.0.1"
description = "Private, offline-first technical document translation (EN<->JA)"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0",
    "lxml>=5.0",
    "httpx>=0.27",      # talks to llama-server / Ollama on 127.0.0.1 only
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "sacrebleu>=2.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true
