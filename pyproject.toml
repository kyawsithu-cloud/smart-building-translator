[project]
name = "smart-building-translator"
version = "0.0.1"
description = "Private, offline-first technical document translation (EN<->JA)"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0",
    "lxml>=5.0",
    "httpx>=0.27",      # talks to llama-server on 127.0.0.1 only
    "rapidfuzz>=3.0",
    "pillow>=10",
    "numpy>=1.26",
    "pymupdf>=1.26",    # PDF read/write — AGPL-3.0 (see README, Licence)
    "rapidocr>=3.4",    # offline OCR; bundles the multilingual PP-OCRv6 models
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true
